name: Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "4.2"

          - python-version: "3.10"
            django-version: "5.2"

          - python-version: "3.11"
            django-version: "4.2"

          - python-version: "3.11"
            django-version: "5.2"

          - python-version: "3.12"
            django-version: "4.2"

          - python-version: "3.12"
            django-version: "5.2"

          - python-version: "3.12"
            django-version: "6.0"

          - python-version: "3.13"
            django-version: "5.2"

          - python-version: "3.13"
            django-version: "6.0"

          - python-version: "3.14"
            django-version: "5.2"

          - python-version: "3.14"
            django-version: "6.0"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install "Django~=${{ matrix.django-version }}.0"

      - name: Show environment
        run: |
          uv run python --version
          uv run python -c "import django; print(django.get_version())"

      - name: Run tests
        run: uv run pytest
